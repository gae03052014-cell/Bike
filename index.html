<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101114">
<meta name="description" content="Murmure — une messagerie sans numéro de téléphone ni e-mail.">
<title>Murmure — messages entre proches</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#101114;--panel:#18191f;--panel2:#22232a;--line:#303139;--text:#f7f7f8;--muted:#999ba5;--pink:#ff4d85;--purple:#a879ff;--green:#47d7a0;--shadow:0 24px 70px #0008}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}button,input,textarea{font:inherit}button{color:inherit;cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--pink);outline-offset:2px}.app{min-height:100vh}.shell{max-width:1180px;min-height:100vh;margin:auto;padding:0 26px 90px}.topbar{height:74px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff0d;position:sticky;top:0;z-index:5;background:#101114ed;backdrop-filter:blur(16px)}.brand{font:800 25px Manrope,sans-serif;letter-spacing:-1.3px;display:flex;align-items:center;gap:9px}.brandmark{width:32px;height:32px;border-radius:11px;background:linear-gradient(140deg,var(--pink),#ff9369);display:grid;place-items:center;box-shadow:0 5px 18px #ff4d8540}.top-actions{display:flex;align-items:center;gap:10px}.iconbtn{width:42px;height:42px;border-radius:15px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:18px}.avatar{width:50px;height:50px;border-radius:50%;padding:2px;background:linear-gradient(135deg,#ff4d85,#a879ff);flex:none}.avatar span{width:100%;height:100%;border-radius:50%;background:#292a31;display:grid;place-items:center;font-weight:800;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.avatar.sm{width:43px;height:43px}.avatar.lg{width:68px;height:68px}.main-grid{display:grid;grid-template-columns:minmax(0,1fr) 315px;gap:42px;padding-top:29px}.section-title{font:800 26px Manrope,sans-serif;letter-spacing:-.7px;margin:0}.subtitle{color:var(--muted);font-size:14px;margin:5px 0 0}.section-row,.page-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}.stories-wrap{margin:27px 0 30px}.stories{display:flex;gap:18px;overflow:auto;padding:3px 2px 9px;scrollbar-width:none}.stories::-webkit-scrollbar{display:none}.story{width:66px;flex:none;text-align:center;border:0;background:none;padding:0}.story-ring{width:62px;height:62px;border-radius:50%;padding:3px;margin:0 auto 7px;background:linear-gradient(135deg,#ff4d85,#ffb15e,#a879ff);position:relative}.story-ring.seen{background:#50515a}.story-ring span{background:#24252c;border:2px solid var(--bg);width:100%;height:100%;display:grid;place-items:center;border-radius:50%;font-weight:700;overflow:hidden}.story-ring img{width:100%;height:100%;object-fit:cover}.story-label{font-size:11px;color:#c5c6cb;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}.add-ring:after{content:'+';position:absolute;right:-2px;bottom:0;background:var(--pink);border:2px solid var(--bg);width:21px;height:21px;border-radius:50%;display:grid;place-items:center;font-size:16px}.text-link{border:0;background:none;color:var(--pink);font-size:13px;font-weight:700}.chat-list{display:flex;flex-direction:column}.chat-item{display:flex;align-items:center;gap:13px;padding:13px 10px;border:0;border-bottom:1px solid #ffffff0a;background:none;text-align:left;border-radius:14px;width:100%}.chat-item:hover{background:#ffffff08}.chat-info{flex:1;min-width:0}.chat-name-row{display:flex;justify-content:space-between;gap:8px;align-items:center}.chat-name{font-weight:700;font-size:15px}.chat-time{color:var(--muted);font-size:11px;white-space:nowrap}.chat-preview{font-size:13px;color:var(--muted);margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.side-card{border:1px solid var(--line);background:linear-gradient(155deg,#1d1b23,#17181d);border-radius:21px;padding:20px;margin-bottom:14px}.side-card h3{margin:0 0 14px;font:700 15px Manrope,sans-serif}.suggestion{display:flex;align-items:center;gap:10px;margin:13px 0}.suggestion .meta{flex:1;min-width:0}.suggestion strong{display:block;font-size:13px}.suggestion small{color:var(--muted);font-size:11px}.follow-btn,.secondary{border:1px solid var(--line);background:var(--panel2);border-radius:11px;padding:8px 11px;font-size:12px;font-weight:700}.follow-btn.active{color:var(--pink);background:#ff4d851c}.promo{background:radial-gradient(circle at 90% 10%,#a879ff40,transparent 45%),linear-gradient(140deg,#282136,#1a1921)}.promo p{font-size:12px;line-height:1.55;color:#c5c0d0;margin:6px 0 15px}.badge{display:inline-flex;color:#dfcfff;background:#a879ff1c;border-radius:99px;padding:6px 9px;font-size:10px;font-weight:700}.primary{border:0;background:linear-gradient(100deg,var(--pink),#ff766d);color:white;font-weight:800;border-radius:13px;padding:12px 16px;box-shadow:0 8px 20px #ff4d8525}.nav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:#15161aee;backdrop-filter:blur(18px);border-top:1px solid #ffffff12;padding:9px 12px calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:center}.nav-inner{width:min(500px,100%);display:flex;justify-content:space-around}.nav-btn{background:none;border:0;color:#888a94;min-width:65px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px}.nav-btn .nav-icon{font-size:20px;line-height:24px}.nav-btn.active{color:white}.empty{padding:42px 18px;text-align:center;border:1px dashed #383941;border-radius:20px;color:var(--muted);font-size:14px}.empty .emoji{font-size:34px;margin-bottom:10px}.page{padding-top:30px}.searchbox,.field{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px 14px;color:var(--text)}.searchbox{margin:7px 0 18px}.discover-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.discover-card{border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:16px;text-align:center}.discover-card .avatar{margin:0 auto 10px}.discover-card p{color:var(--muted);font-size:12px;margin:5px 0 13px}.story-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.story-tile{min-height:205px;border-radius:17px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(160deg,#653d70,#252033);border:1px solid #ffffff10;text-align:left}.story-tile:nth-child(3n){background:linear-gradient(160deg,#315a5a,#222b36)}.story-tile:nth-child(3n+1){background:linear-gradient(160deg,#714633,#342c32)}.story-tile p{font:700 17px Manrope;line-height:1.25}.profile-card{max-width:680px;margin:auto;border:1px solid var(--line);background:var(--panel);border-radius:22px;padding:24px}.profile-top{display:flex;align-items:center;gap:16px;padding-bottom:20px;border-bottom:1px solid var(--line)}.profile-top h2{margin:0;font:800 22px Manrope}.handle,.notice{color:var(--muted);font-size:12px;line-height:1.5}.profile-form label,.onboarding-card label{display:block;color:#b9bac1;font-size:12px;font-weight:700;margin:16px 0 7px}.profile-form textarea{resize:vertical;min-height:75px}.profile-actions{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap}.notice{margin-top:16px}.modal-backdrop{position:fixed;inset:0;background:#000a;z-index:30;display:grid;place-items:center;padding:18px;backdrop-filter:blur(7px)}.modal{width:min(440px,100%);background:#1b1c22;border:1px solid #ffffff18;border-radius:22px;padding:22px;box-shadow:var(--shadow)}.modal h2{font:800 21px Manrope;margin:0 0 5px}.modal-sub{font-size:13px;color:var(--muted);margin:0 0 17px}.modal .field{margin-bottom:10px}.modal-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:10px}.onboarding{position:fixed;inset:0;z-index:20;background:radial-gradient(ellipse at 75% 5%,#a879ff30,transparent 37%),radial-gradient(ellipse at 5% 90%,#ff4d8520,transparent 35%),var(--bg);display:grid;place-items:center;padding:20px}.onboarding-card{width:min(430px,100%);border:1px solid #ffffff14;background:#17181def;padding:30px;border-radius:26px;box-shadow:var(--shadow)}.onboarding-card .brand{margin-bottom:26px}.onboarding-card h1{font:800 29px/1.15 Manrope;letter-spacing:-1px;margin:0 0 9px}.onboarding-card>p{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 22px}.onboarding-card .primary{width:100%;margin-top:17px}.privacy-note{background:#ffffff08;border:1px solid #ffffff0b;padding:12px;border-radius:13px;color:#b8bac2;font-size:11px;line-height:1.5;margin-top:17px}.chat-view{position:fixed;inset:0;z-index:25;background:var(--bg);display:flex;flex-direction:column}.chat-top{height:68px;padding:0 max(16px,calc((100vw - 760px)/2));border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px;background:#15161bee}.back-btn{border:0;background:none;font-size:25px;padding:5px}.chat-peer{flex:1}.chat-peer strong{display:block;font-size:14px}.chat-peer small{color:var(--green);font-size:11px}.chat-tools{display:flex;gap:7px}.chat-tools button{border:0;background:var(--panel2);border-radius:12px;width:39px;height:39px;font-size:17px}.messages{flex:1;overflow:auto;width:min(760px,100%);margin:0 auto;padding:20px 17px;display:flex;flex-direction:column;gap:9px}.day-label{text-align:center;color:var(--muted);font-size:10px;margin:4px 0 9px}.bubble{max-width:min(76%,460px);padding:11px 13px;border-radius:17px;font-size:14px;line-height:1.45;overflow-wrap:anywhere;white-space:pre-wrap}.bubble.in{align-self:flex-start;background:#25262d;border-bottom-left-radius:5px}.bubble.out{align-self:flex-end;background:linear-gradient(125deg,#d83f79,#a551bd);border-bottom-right-radius:5px}.bubble time{display:block;font-size:9px;opacity:.65;text-align:right;margin-top:4px}.bubble img{max-width:100%;border-radius:10px;display:block;margin-bottom:6px}.composer-wrap{padding:10px max(15px,calc((100vw - 760px)/2)) calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#15161a}.composer{display:flex;align-items:center;gap:8px}.composer input[type=text]{flex:1;min-width:0;background:#24252c;border:1px solid #ffffff10;border-radius:22px;padding:12px 15px;color:white}.composer button{width:43px;height:43px;border:0;border-radius:50%;background:var(--pink);font-size:18px}.toast{position:fixed;z-index:50;bottom:90px;left:50%;transform:translateX(-50%);background:#2b2c32;border:1px solid #ffffff18;padding:11px 16px;border-radius:13px;font-size:13px;box-shadow:var(--shadow);max-width:90vw}.story-view{position:fixed;inset:0;z-index:40;background:#131116;display:grid;place-items:center;padding:18px}.story-content{width:min(390px,100%);height:min(720px,88vh);border-radius:24px;padding:19px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(150deg,#6b426e,#292336 58%,#24212a);box-shadow:var(--shadow)}.story-content p{font:800 27px/1.25 Manrope;white-space:pre-wrap}.story-close{border:0;background:#0005;border-radius:50%;height:38px;width:38px;font-size:20px}.story-progress{height:3px;background:#ffffff55;border-radius:5px;margin-bottom:14px}.story-progress:before{content:'';display:block;width:45%;height:100%;background:white;border-radius:5px}.local-tag{font-size:10px;color:var(--muted);padding:4px 8px;border:1px solid var(--line);border-radius:9px}
@media(max-width:850px){.main-grid{grid-template-columns:1fr;gap:15px}.side-column{display:grid;grid-template-columns:1fr 1fr;gap:12px}.side-card{margin:0}.shell{max-width:680px}.discover-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.shell{padding:0 16px 90px}.topbar{height:65px}.main-grid{padding-top:22px}.side-column{display:none}.section-title{font-size:23px}.discover-grid{gap:9px}.discover-card{padding:13px 8px}.story-grid{grid-template-columns:repeat(2,1fr)}.story-tile{min-height:185px}.profile-card{padding:19px}.page{padding-top:23px}.onboarding-card{padding:25px 22px}.onboarding-card h1{font-size:27px}}
</style>
</head>
<body><div id="app"></div><div id="overlay"></div><div id="toast" class="toast" hidden role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
const KEY='murmure.bike.demo.v1';
const examples=[{id:'lea-demo',name:'Léa Martin',handle:'lea.martin',bio:'Photos, cafés et couchers de soleil ☀️',emoji:'🌻'},{id:'noe-demo',name:'Noé Bernard',handle:'noe.b',bio:'Toujours partant pour une aventure 🏕️',emoji:'🧢'},{id:'ines-demo',name:'Inès R.',handle:'ines.r',bio:'Musique dans les oreilles 🎧',emoji:'🎧'},{id:'sam-demo',name:'Sam Diallo',handle:'sam.diallo',bio:'Créateur de petits moments ✨',emoji:'🪩'},{id:'maya-demo',name:'Maya Chen',handle:'maya.chen',bio:'Un livre, un thé, et ça repart ☕',emoji:'🪴'},{id:'adam-demo',name:'Adam L.',handle:'adam.l',bio:'📍 Lyon',emoji:'🏀'}];
let state;try{state=JSON.parse(localStorage.getItem(KEY)||'null')}catch{}state=state&&typeof state==='object'?state:{user:null,contacts:[],chats:{},stories:[],following:[]};let page='Accueil',chatId=null,timer;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{notify('Le stockage local est indisponible.')}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const person=id=>state.contacts.find(p=>p.id===id)||examples.find(p=>p.id===id)||{id,name:'Contact',handle:'contact',emoji:'🙂'};
const initials=p=>(p.name||'?').trim().split(/\s+/).slice(0,2).map(s=>s[0]).join('').toUpperCase();
const avatar=(p,size='')=>`<div class="avatar ${size}"><span>${p.avatar?`<img src="${esc(p.avatar)}" alt="">`:esc(p.emoji||initials(p))}</span></div>`;
const timeAgo=t=>{let d=Date.now()-t;return d<60000?'à l’instant':d<3600000?Math.floor(d/60000)+' min':d<86400000?Math.floor(d/3600000)+' h':new Date(t).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})};
function notify(s){let e=document.getElementById('toast');e.textContent=s;e.hidden=false;clearTimeout(timer);timer=setTimeout(()=>e.hidden=true,2600)}
function stories(){return [{id:'s1',user:'lea-demo',text:'Petit rayon de soleil aujourd’hui 🌞',created:Date.now()-3600000},{id:'s2',user:'noe-demo',text:'La vue valait la montée 🏔️',created:Date.now()-7200000},{id:'s3',user:'ines-demo',text:'Nouvelle playlist, même humeur 🎶',created:Date.now()-16000000},...(state.stories||[])].filter(s=>Date.now()-s.created<86400000)}
function logo(){return '<div class="brand"><span class="brandmark">✳</span>Murmure</div>'}
function onboarding(){document.getElementById('app').innerHTML=`<div class="onboarding"><form class="onboarding-card" id="join">${logo()}<h1>Les bons moments,<br>sans complications.</h1><p>Crée ton espace avec un pseudo. Pas de numéro, pas d’adresse e-mail.</p><label for="name">Comment t’appelles-tu ?</label><input id="name" class="field" maxlength="24" placeholder="Ex. Alex" autocomplete="nickname" required><label for="handle">Choisis ton identifiant</label><input id="handle" class="field" maxlength="20" placeholder="alex.cool" autocomplete="username" required><div class="privacy-note">🔒 Démo locale : ton profil et tes messages restent dans ce navigateur. Aucun compte n’est envoyé à un serveur.</div><button class="primary">Créer mon espace →</button><div class="notice">Un pseudonyme suffit pour découvrir l’interface.</div></form></div>`;document.getElementById('join').onsubmit=e=>{e.preventDefault();let name=document.getElementById('name').value.trim(),handle=document.getElementById('handle').value.trim().replace(/^@/,'').toLowerCase().replace(/[^a-z0-9._]/g,'');if(name.length<2||handle.length<3)return notify('Entre un nom et un identifiant de 3 caractères minimum.');state.user={id:'u-'+Math.random().toString(36).slice(2,10),name,handle,bio:'',emoji:'🙂'};save();render()}}
function header(){return `<header class="topbar">${logo()}<div class="top-actions"><span class="local-tag">● Démo locale</span><button class="iconbtn" aria-label="Nouveau message" onclick="M.newChat()">✎</button><button class="iconbtn" aria-label="Mon profil" onclick="M.go('Profil')">${esc(state.user.emoji||'🙂')}</button></div></header>`}
function nav(){return `<nav class="nav"><div class="nav-inner">${[['Accueil','⌂'],['Découvrir','⌕'],['Stories','◉'],['Profil','○']].map(([n,i])=>`<button class="nav-btn ${page===n?'active':''}" onclick="M.go('${n}')"><span class="nav-icon">${i}</span>${n}</button>`).join('')}</div></nav>`}
function storyStrip(){let list=stories(),ids=[...new Set(list.map(s=>s.user))];return `<section class="stories-wrap"><div class="section-row"><div><h2 class="section-title" style="font-size:17px">Stories</h2><p class="subtitle">Les petits moments de tes proches</p></div><button class="text-link" onclick="M.go('Stories')">Tout voir</button></div><div class="stories"><button class="story" onclick="M.addStory()"><div class="story-ring add-ring"><span>${esc(state.user.emoji||'🙂')}</span></div><span class="story-label">Ta story</span></button>${ids.map(id=>{let s=list.filter(x=>x.user===id).sort((a,b)=>b.created-a.created)[0],p=person(id);return `<button class="story" onclick="M.viewStory('${esc(s.id)}')"><div class="story-ring"><span>${esc(p.emoji||initials(p))}</span></div><span class="story-label">${esc(p.name.split(' ')[0])}</span></button>`}).join('')}</div></section>`}
function chatList(){return Object.keys(state.chats||{}).map(id=>({id,p:person(id),msgs:state.chats[id]})).filter(x=>x.msgs.length).sort((a,b)=>b.msgs.at(-1).time-a.msgs.at(-1).time)}
function suggestions(){let known=new Set([state.user.id,...state.contacts.map(x=>x.id)]);return examples.filter(p=>!known.has(p.id)).slice(0,3)}
function sidebar(){return `<aside class="side-column"><div class="side-card"><h3>À découvrir ✨</h3>${suggestions().map(p=>`<div class="suggestion">${avatar(p,'sm')}<div class="meta"><strong>${esc(p.name)}</strong><small>@${esc(p.handle)}</small></div><button class="follow-btn" onclick="M.follow('${p.id}')">Suivre</button></div>`).join('')||'<small style="color:var(--muted)">Tu suis tout le monde !</small>'}<button class="text-link" onclick="M.go('Découvrir')">Explorer →</button></div><div class="side-card promo"><span class="badge">✦ L’esprit Murmure</span><h3 style="margin-top:13px">Ta vie privée, d’abord.</h3><p>Choisis un pseudo. Pas besoin de partager ton numéro ou ton e-mail.</p><button class="secondary" onclick="M.go('Profil')">Voir mon profil</button></div></aside>`}
function home(){let list=chatList();return `<main class="main-grid"><section><div class="section-row"><div><h1 class="section-title">Salut ${esc(state.user.name.split(' ')[0])} 👋</h1><p class="subtitle">Quoi de neuf dans ton cercle ?</p></div><button class="primary" onclick="M.newChat()">＋ Message</button></div>${storyStrip()}<div class="section-row"><div><h2 class="section-title" style="font-size:20px">Messages</h2><p class="subtitle">Tes conversations récentes</p></div><button class="iconbtn" aria-label="Ajouter un contact" onclick="M.newChat()">＋</button></div><div class="chat-list">${list.length?list.map(x=>{let m=x.msgs.at(-1);return `<button class="chat-item" onclick="M.openChat('${esc(x.id)}')">${avatar(x.p)}<div class="chat-info"><div class="chat-name-row"><span class="chat-name">${esc(x.p.name)}</span><time class="chat-time">${timeAgo(m.time)}</time></div><div class="chat-preview">${m.from===state.user.id?'Toi : ':''}${esc(m.text||'📷 Photo')}</div></div></button>`}).join(''):'<div class="empty"><div class="emoji">💬</div><strong>Ton espace est prêt.</strong><p>Ajoute un contact exemple pour découvrir la messagerie.</p><button class="primary" onclick="M.newChat()">Trouver un contact</button></div>'}</div></section>${sidebar()}</main>`}
function peopleGrid(list){return list.map(p=>`<article class="discover-card">${avatar(p,'lg')}<strong>${esc(p.name)}</strong><p>@${esc(p.handle)}<br>${esc(p.bio)}</p><button class="follow-btn ${(state.following||[]).includes(p.id)?'active':''}" onclick="M.follow('${p.id}')">${(state.following||[]).includes(p.id)?'✓ Suivi':'＋ Suivre'}</button> <button class="follow-btn" onclick="M.startChat('${p.id}')">Message</button></article>`).join('')||'<div class="empty">Aucun profil trouvé.</div>'}
function discover(){return `<main class="page"><div class="page-head"><div><h1 class="section-title">Découvrir</h1><p class="subtitle">Explore les profils de démonstration</p></div></div><input id="search" class="searchbox" placeholder="⌕  Rechercher un pseudo…" oninput="M.filter(this.value)"><div id="people" class="discover-grid">${peopleGrid(examples.filter(p=>p.id!==state.user.id))}</div><p class="notice">Les profils affichés sont des exemples intégrés. Les suivre n’envoie pas de demande réelle.</p></main>`}
function storiesPage(){let ss=stories();return `<main class="page"><div class="page-head"><div><h1 class="section-title">Stories</h1><p class="subtitle">Des instants qui disparaissent après 24 h</p></div><button class="primary" onclick="M.addStory()">＋ Ajouter</button></div>${ss.length?`<div class="story-grid">${ss.map(s=>{let p=person(s.user);return `<button class="story-tile" onclick="M.viewStory('${esc(s.id)}')"><div>${avatar(p,'sm')}<small style="margin-left:8px">${esc(p.name)} · ${timeAgo(s.created)}</small></div><p>${esc(s.text)}</p><small>Voir la story →</small></button>`}).join('')}</div>`:'<div class="empty">Le fil est calme. Partage un moment !</div>'}</main>`}
function profile(){let p=state.user;return `<main class="page"><div class="page-head"><div><h1 class="section-title">Mon profil</h1><p class="subtitle">Ton identité, à ta façon</p></div></div><form id="profileForm" class="profile-card"><div class="profile-top">${avatar(p,'lg')}<div><h2>${esc(p.name)}</h2><div class="handle">@${esc(p.handle)}</div></div></div><div class="profile-form"><label for="editName">Nom affiché</label><input class="field" id="editName" maxlength="24" value="${esc(p.name)}"><label for="editBio">Bio</label><textarea class="field" id="editBio" maxlength="100" placeholder="Quelques mots sur toi…">${esc(p.bio||'')}</textarea><label for="editEmoji">Ton avatar (emoji)</label><input class="field" id="editEmoji" maxlength="8" value="${esc(p.emoji||'🙂')}"><div class="profile-actions"><button class="primary">Enregistrer</button><button class="secondary" type="button" onclick="M.copyHandle()">Copier mon identifiant</button><button class="secondary" type="button" onclick="M.reset()">Effacer mes données</button></div></div><p class="notice">Identifiant partageable : <strong>@${esc(p.handle)}</strong>. Cette démo stocke les données sur cet appareil.</p></form></main>`}
function render(){if(!state.user)return onboarding();let body=page==='Découvrir'?discover():page==='Stories'?storiesPage():page==='Profil'?profile():home();document.getElementById('app').innerHTML=`<div class="shell">${header()}${body}</div>${nav()}`;if(page==='Profil')document.getElementById('profileForm').onsubmit=e=>{e.preventDefault();state.user.name=document.getElementById('editName').value.trim()||state.user.name;state.user.bio=document.getElementById('editBio').value.trim();state.user.emoji=document.getElementById('editEmoji').value.trim()||'🙂';save();render();notify('Profil mis à jour')}}
function modal(html){document.getElementById('overlay').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)M.closeModal()"><section class="modal">${html}</section></div>`}
function closeModal(){document.getElementById('overlay').innerHTML=''}
function newChat(){modal(`<h2>Nouvelle conversation</h2><p class="modal-sub">Trouve un profil exemple avec son identifiant.</p><form id="addForm"><input class="field" id="contact" placeholder="Ex. @lea.martin" required><div class="modal-actions"><button type="button" class="secondary" onclick="M.closeModal()">Annuler</button><button class="primary">Continuer</button></div></form><p class="notice">La recherche réelle entre utilisateurs nécessitera un serveur. Cette maquette fonctionne localement.</p>`);document.getElementById('addForm').onsubmit=e=>{e.preventDefault();let h=document.getElementById('contact').value.trim().replace(/^@/,'').toLowerCase(),p=examples.find(x=>x.handle.toLowerCase()===h);if(!p)return notify('Profil introuvable. Essaie @lea.martin');if(p.id===state.user.id)return notify('Tu ne peux pas t’ajouter toi-même.');if(!state.contacts.some(x=>x.id===p.id))state.contacts.push(p);state.chats[p.id]=state.chats[p.id]||[];save();closeModal();openChat(p.id)}}
function openChat(id){chatId=id;state.chats[id]=state.chats[id]||[];renderChat()}
function renderChat(){let p=person(chatId),msgs=state.chats[chatId]||[];document.getElementById('overlay').innerHTML=`<div class="chat-view"><header class="chat-top"><button class="back-btn" onclick="M.closeChat()" aria-label="Retour">‹</button>${avatar(p,'sm')}<div class="chat-peer"><strong>${esc(p.name)}</strong><small>● Profil de démonstration</small></div><div class="chat-tools"><button onclick="M.callInfo()" aria-label="Appel audio">☎</button><button onclick="M.chatInfo()" aria-label="Options">···</button></div></header><div class="messages" id="messages"><div class="day-label">Aujourd’hui · conversation locale</div>${msgs.map(m=>`<div class="bubble ${m.from===state.user.id?'out':'in'}">${m.image?`<img src="${esc(m.image)}" alt="Photo partagée">`:''}${esc(m.text)}<time>${new Date(m.time).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})} ${m.from===state.user.id?'✓':''}</time></div>`).join('')||'<div class="empty" style="margin:auto 0"><div class="emoji">👋</div><strong>Dis bonjour !</strong><p>Cette conversation est enregistrée sur cet appareil.</p></div>'}</div><form class="composer-wrap" id="sendForm"><div class="composer"><button type="button" class="secondary" style="width:42px;height:42px;padding:0;border-radius:50%" onclick="document.getElementById('imageInput').click()" aria-label="Joindre une image">＋</button><input id="message" type="text" autocomplete="off" maxlength="2000" placeholder="Écris un message…"><input id="imageInput" type="file" accept="image/*" hidden><button aria-label="Envoyer">➤</button></div></form></div>`;document.getElementById('sendForm').onsubmit=e=>{e.preventDefault();let input=document.getElementById('message'),text=input.value.trim();if(!text)return;state.chats[chatId].push({from:state.user.id,text,time:Date.now()});save();renderChat()};document.getElementById('imageInput').onchange=e=>{let f=e.target.files[0];if(!f)return;if(f.size>2*1024*1024)return notify('Image limitée à 2 Mo.');let r=new FileReader();r.onload=()=>{state.chats[chatId].push({from:state.user.id,text:'',image:r.result,time:Date.now()});save();renderChat()};r.readAsDataURL(f)};setTimeout(()=>{let el=document.getElementById('messages');if(el)el.scrollTop=el.scrollHeight},0);document.getElementById('message').focus()}
function closeChat(){chatId=null;closeModal();render()}
function addStory(){modal(`<h2>Partager une story</h2><p class="modal-sub">Un message éphémère, visible ici pendant 24 heures.</p><form id="storyForm"><textarea class="field" id="storyText" maxlength="180" rows="4" placeholder="Qu’as-tu envie de partager ?" required></textarea><div class="modal-actions"><button type="button" class="secondary" onclick="M.closeModal()">Annuler</button><button class="primary">Partager</button></div></form>`);document.getElementById('storyForm').onsubmit=e=>{e.preventDefault();state.stories.push({id:'st-'+Date.now(),user:state.user.id,text:document.getElementById('storyText').value.trim(),created:Date.now()});save();closeModal();page='Stories';render();notify('Story publiée pour 24 h')}}
function viewStory(id){let s=stories().find(x=>x.id===id);if(!s)return;let p=person(s.user);document.getElementById('overlay').innerHTML=`<div class="story-view" onclick="M.closeModal()"><article class="story-content" onclick="event.stopPropagation()"><div><div class="story-progress"></div><div style="display:flex;align-items:center;gap:10px">${avatar(p,'sm')}<div><strong>${esc(p.name)}</strong><div style="font-size:11px;color:#ffffffad">${timeAgo(s.created)}</div></div><button class="story-close" style="margin-left:auto" onclick="M.closeModal()">×</button></div></div><p>${esc(s.text)}</p><small>Story éphémère · maquette locale</small></article></div>`}
function follow(id){state.following=state.following||[];state.following=state.following.includes(id)?state.following.filter(x=>x!==id):[...state.following,id];let p=person(id);if(!state.contacts.some(x=>x.id===id))state.contacts.push(p);save();render()}
function startChat(id){if(!state.contacts.some(x=>x.id===id))state.contacts.push(person(id));state.chats[id]=state.chats[id]||[];save();openChat(id)}
function filter(q){let x=q.trim().toLowerCase();document.getElementById('people').innerHTML=peopleGrid(examples.filter(p=>p.id!==state.user.id&&(!x||p.name.toLowerCase().includes(x)||p.handle.includes(x))))}
function go(n){page=n;closeModal();render()}
function copyHandle(){let text='@'+state.user.handle;if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>notify('Identifiant copié')).catch(()=>notify(text));else notify(text)}
function reset(){modal(`<h2>Effacer cet espace ?</h2><p class="modal-sub">Profil, messages et stories locales seront supprimés de ce navigateur.</p><div class="modal-actions"><button class="secondary" onclick="M.closeModal()">Annuler</button><button class="primary" onclick="M.confirmReset()">Tout effacer</button></div>`)}
function confirmReset(){localStorage.removeItem(KEY);state={user:null,contacts:[],chats:{},stories:[],following:[]};closeModal();render()}
function callInfo(){notify('Les appels nécessitent un service audio/vidéo, non inclus dans cette maquette.')}
function chatInfo(){let p=person(chatId);modal(`<h2>${esc(p.name)}</h2><p class="modal-sub">@${esc(p.handle)} · profil exemple</p><p class="notice">Les messages restent sur cet appareil et ne sont pas transmis à ce profil.</p><div class="modal-actions"><button class="secondary" onclick="M.closeModal()">Fermer</button></div>`)}
window.M={go,newChat,closeModal,openChat,closeChat,addStory,viewStory,follow,startChat,filter,copyHandle,reset,confirmReset,callInfo,chatInfo};render();
})();
</script></body></html>
