<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101114"><meta name="description" content="Murmure, une messagerie sans numéro de téléphone ni e-mail."><title>Murmure — messagerie</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#101114;--panel:#18191f;--panel2:#22232a;--line:#303139;--text:#f7f7f8;--muted:#999ba5;--pink:#ff4d85;--purple:#a879ff;--green:#47d7a0;--shadow:0 24px 70px #0008}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}button,input,textarea{font:inherit}button{color:inherit;cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--pink);outline-offset:2px}button:disabled{opacity:.55;cursor:wait}.shell{max-width:1120px;min-height:100vh;margin:auto;padding:0 25px 88px}.topbar{height:72px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff0d;position:sticky;top:0;z-index:5;background:#101114ed;backdrop-filter:blur(16px)}.brand{font:800 25px Manrope,sans-serif;letter-spacing:-1.3px;display:flex;align-items:center;gap:9px}.brandmark{width:32px;height:32px;border-radius:11px;background:linear-gradient(140deg,var(--pink),#ff9369);display:grid;place-items:center;box-shadow:0 5px 18px #ff4d8540}.top-actions{display:flex;align-items:center;gap:10px}.iconbtn{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:18px}.avatar{width:48px;height:48px;border-radius:50%;padding:2px;background:linear-gradient(135deg,#ff4d85,#a879ff);flex:none}.avatar span{width:100%;height:100%;border-radius:50%;background:#292a31;display:grid;place-items:center;font-weight:800;overflow:hidden}.avatar.sm{width:42px;height:42px}.avatar.lg{width:68px;height:68px}.avatar img{width:100%;height:100%;object-fit:cover}.main-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:38px;padding-top:30px}.title{font:800 27px Manrope;letter-spacing:-.7px;margin:0}.subtitle{color:var(--muted);font-size:14px;margin:5px 0 0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.primary{border:0;background:linear-gradient(100deg,var(--pink),#ff766d);color:white;font-weight:800;border-radius:13px;padding:12px 16px;box-shadow:0 8px 20px #ff4d8525}.secondary{border:1px solid var(--line);background:var(--panel2);border-radius:11px;padding:10px 12px;font-size:13px;font-weight:700}.text-link{border:0;background:none;color:var(--pink);font-size:13px;font-weight:700}.search{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 15px;color:var(--text);margin:7px 0 16px}.inbox{display:flex;flex-direction:column}.contact{display:flex;align-items:center;gap:13px;padding:13px 10px;border:0;border-bottom:1px solid #ffffff0a;background:none;text-align:left;border-radius:14px;width:100%}.contact:hover{background:#ffffff08}.contact-info{flex:1;min-width:0}.contact-line{display:flex;justify-content:space-between;gap:8px}.contact-name{font-weight:700;font-size:15px}.contact-sub{color:var(--muted);font-size:13px;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.time{color:var(--muted);font-size:11px;white-space:nowrap}.side-card{border:1px solid var(--line);background:linear-gradient(155deg,#1d1b23,#17181d);border-radius:20px;padding:19px;margin-bottom:14px}.side-card h3{margin:0 0 10px;font:700 15px Manrope}.side-card p{color:var(--muted);font-size:12px;line-height:1.55;margin:5px 0}.privacy-tag{font-size:10px;color:#dfcfff;background:#a879ff1c;border-radius:99px;padding:6px 9px;display:inline-flex;font-weight:700}.nav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:#15161aee;backdrop-filter:blur(18px);border-top:1px solid #ffffff12;padding:9px 12px calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:center}.nav-inner{width:min(450px,100%);display:flex;justify-content:space-around}.nav-btn{background:none;border:0;color:#888a94;min-width:65px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px}.nav-btn span{font-size:20px;line-height:24px}.nav-btn.active{color:#fff}.page{padding-top:28px}.field{width:100%;background:#111216;border:1px solid var(--line);border-radius:12px;padding:12px 13px;color:var(--text)}.field::placeholder{color:#747681}.profile{max-width:650px;margin:auto;border:1px solid var(--line);background:var(--panel);border-radius:22px;padding:24px}.profile-head{display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding-bottom:18px}.profile-head h2{margin:0;font:800 21px Manrope}.label{display:block;color:#b9bac1;font-size:12px;font-weight:700;margin:16px 0 7px}.profile textarea{min-height:75px;resize:vertical}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}.notice{font-size:11px;color:var(--muted);line-height:1.55;margin-top:15px}.empty{padding:42px 18px;text-align:center;border:1px dashed #383941;border-radius:20px;color:var(--muted);font-size:14px}.empty .emoji{font-size:34px;margin-bottom:10px}.onboarding{position:fixed;inset:0;z-index:20;background:radial-gradient(ellipse at 75% 5%,#a879ff30,transparent 37%),radial-gradient(ellipse at 5% 90%,#ff4d8520,transparent 35%),var(--bg);display:grid;place-items:center;padding:20px}.onboarding-card{width:min(430px,100%);border:1px solid #ffffff14;background:#17181df2;padding:30px;border-radius:26px;box-shadow:var(--shadow)}.onboarding-card .brand{margin-bottom:26px}.onboarding-card h1{font:800 30px/1.14 Manrope;letter-spacing:-1px;margin:0 0 10px}.onboarding-card>p{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 22px}.onboarding-card .primary{width:100%;margin-top:17px}.onboarding-card .label{margin-top:14px}.hint{background:#ffffff08;border:1px solid #ffffff0b;padding:12px;border-radius:13px;color:#b8bac2;font-size:11px;line-height:1.5;margin-top:15px}.modalback{position:fixed;inset:0;background:#000a;z-index:30;display:grid;place-items:center;padding:18px;backdrop-filter:blur(7px)}.modal{width:min(440px,100%);background:#1b1c22;border:1px solid #ffffff18;border-radius:22px;padding:22px;box-shadow:var(--shadow);max-height:90vh;overflow:auto}.modal h2{font:800 21px Manrope;margin:0 0 5px}.modal-sub{font-size:13px;color:var(--muted);margin:0 0 17px}.modal .field{margin-bottom:10px}.modal-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:10px}.chat{position:fixed;inset:0;z-index:25;background:var(--bg);display:flex;flex-direction:column}.chat-head{height:68px;padding:0 max(16px,calc((100vw - 760px)/2));border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px;background:#15161bee}.back{border:0;background:none;font-size:26px;padding:5px}.peer{flex:1}.peer strong{display:block;font-size:14px}.peer small{color:var(--green);font-size:11px}.messages{flex:1;overflow:auto;width:min(760px,100%);margin:0 auto;padding:20px 17px;display:flex;flex-direction:column;gap:9px}.day{text-align:center;color:var(--muted);font-size:10px;margin:4px 0 9px}.bubble{max-width:min(76%,460px);padding:11px 13px;border-radius:17px;font-size:14px;line-height:1.45;overflow-wrap:anywhere;white-space:pre-wrap}.bubble.in{align-self:flex-start;background:#25262d;border-bottom-left-radius:5px}.bubble.out{align-self:flex-end;background:linear-gradient(125deg,#d83f79,#a551bd);border-bottom-right-radius:5px}.bubble time{display:block;font-size:9px;opacity:.65;text-align:right;margin-top:4px}.bubble img{max-width:100%;border-radius:10px;display:block;margin-bottom:6px}.composer{padding:10px max(15px,calc((100vw - 760px)/2)) calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#15161a}.compose{display:flex;align-items:center;gap:8px}.compose input[type=text]{flex:1;min-width:0;background:#24252c;border:1px solid #ffffff10;border-radius:22px;padding:12px 15px;color:white}.send{width:43px;height:43px;border:0;border-radius:50%;background:var(--pink);font-size:18px}.toast{position:fixed;z-index:60;bottom:88px;left:50%;transform:translateX(-50%);background:#2b2c32;border:1px solid #ffffff18;padding:11px 16px;border-radius:13px;font-size:13px;box-shadow:var(--shadow);max-width:90vw}.toast[hidden]{display:none}.status{font-size:10px;color:var(--muted);padding:5px 8px;border:1px solid var(--line);border-radius:9px}.error{color:#ff9eaa;font-size:12px;margin:8px 0;line-height:1.45}
@media(max-width:820px){.main-grid{grid-template-columns:1fr;gap:15px}.side-column{display:grid;grid-template-columns:1fr 1fr;gap:12px}.side-card{margin:0}.shell{max-width:680px}}@media(max-width:560px){.shell{padding:0 15px 86px}.topbar{height:64px}.main-grid{padding-top:22px}.side-column{display:none}.title{font-size:23px}.profile{padding:18px}.page{padding-top:22px}.onboarding-card{padding:25px 22px}.onboarding-card h1{font-size:27px}}
</style>
</head>
<body><div id="app"></div><div id="overlay"></div><div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script>
(()=>{'use strict';
const DBKEY='murmure.dburl',SESSION='murmure.session';let db=(localStorage.getItem(DBKEY)||'https://messagame-e5a03-default-rtdb.europe-west1.firebasedatabase.app').replace(/\/+$/,''),me=null,page='Messages',active=null,poll=null,toastTimer=0;
try{me=JSON.parse(localStorage.getItem(SESSION)||'null')}catch{}
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),handle=s=>String(s||'').trim().replace(/^@/,'').toLowerCase().replace(/[^a-z0-9._-]/g,'').slice(0,24),key=s=>encodeURIComponent(s).replace(/\./g,'%2E'),avatar=(emoji='🙂',size='')=>`<div class="avatar ${size}"><span>${esc(emoji||'🙂')}</span></div>`,stamp=t=>new Date(t||Date.now()).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}),ago=t=>{let n=Date.now()-t;return n<60000?'maintenant':n<3600000?Math.floor(n/60000)+' min':n<86400000?Math.floor(n/3600000)+' h':new Date(t).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})};
function notify(s){let e=$('#toast');e.textContent=s;e.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.hidden=true,3200)}
function dburl(){return db.replace(/\/+$/,'')}
async function request(path,opts={}){if(!db)throw Error('Configure l’URL Firebase dans les réglages.');let r=await fetch(dburl()+path+'.json',{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});let d=await r.json().catch(()=>null);if(!r.ok||d&&d.error)throw Error((d&&d.error)||('Erreur réseau '+r.status));return d}
const get=path=>request(path),put=(path,data)=>request(path,{method:'PUT',body:JSON.stringify(data)}),post=(path,data)=>request(path,{method:'POST',body:JSON.stringify(data)});
async function derive(pass,salt){let material=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveBits']);let bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:150000,hash:'SHA-256'},material,256);return [...new Uint8Array(bits)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function logo(){return '<div class="brand"><span class="brandmark">✳</span>Murmure</div>'}
function onboarding(){document.getElementById('app').innerHTML=`<div class="onboarding"><section class="onboarding-card">${logo()}<h1>Une messagerie<br>à ton nom.</h1><p>Crée un compte avec un pseudo et un mot de passe. Aucun numéro ni e-mail demandé.</p><form id="auth"><label class="label" for="user">Identifiant</label><input id="user" class="field" maxlength="24" autocomplete="username" placeholder="Ton identifiant" required><label class="label" for="pass">Mot de passe</label><input id="pass" class="field" type="password" minlength="8" autocomplete="current-password" placeholder="8 caractères minimum" required><div class="hint">Utilise le même identifiant et mot de passe sur tes appareils. Ta connexion et tes messages passent par Firebase. Évite les informations sensibles : cette version n’est pas chiffrée de bout en bout.</div><div id="authError" class="error"></div><button id="authBtn" class="primary">Se connecter / créer mon compte →</button></form><p class="notice">Pas de compte de démonstration ni de profil prérempli. Chaque identifiant correspond à un compte réel de cette instance.</p></section></div>`;$('#auth').onsubmit=authenticate}
async function authenticate(e){e.preventDefault();let h=handle($('#user').value),pw=$('#pass').value,btn=$('#authBtn'),err=$('#authError');if(h.length<3){err.textContent='L’identifiant doit contenir au moins 3 caractères.';return}if(pw.length<8){err.textContent='Choisis un mot de passe de 8 caractères minimum.';return}if(!crypto.subtle){err.textContent='Ce navigateur ne prend pas en charge la sécurité requise.';return}btn.disabled=true;err.textContent='Connexion…';try{let path='/murmure/v1/credentials/'+key(h),cred=await get(path),profile;if(cred){let hash=await derive(pw,cred.salt);if(hash!==cred.hash)throw Error('Mot de passe incorrect.');profile=await get('/murmure/v1/profiles/'+key(h));if(!profile)throw Error('Profil introuvable. Contacte le support de cette instance.')}else{let salt=crypto.getRandomValues(new Uint8Array(16));let saltText=[...salt].map(x=>x.toString(16).padStart(2,'0')).join('');let hash=await derive(pw,saltText);profile={handle:h,name:h,emoji:'🙂',bio:''};await put('/murmure/v1/credentials/'+key(h),{salt:saltText,hash,created:Date.now()});try{await put('/murmure/v1/profiles/'+key(h),profile)}catch(err){await request('/murmure/v1/credentials/'+key(h),{method:'DELETE'});throw err}}me=profile;localStorage.setItem(SESSION,JSON.stringify(me));render()}catch(x){err.textContent=errorText(x);btn.disabled=false}}
function errorText(e){let s=String(e&&e.message||e);if(s.includes('Failed to fetch'))return'Connexion au serveur impossible. Vérifie Internet et l’URL Firebase dans Réglages.';if(s.includes('PERMISSION_DENIED'))return'Accès Firebase refusé. Les règles de la base doivent autoriser les opérations Murmure.';return s}
function top(){return `<header class="topbar">${logo()}<div class="top-actions"><span class="status">${navigator.onLine?'● En ligne':'● Hors ligne'}</span><button class="iconbtn" aria-label="Nouvelle conversation" onclick="M.newChat()">✎</button><button class="iconbtn" aria-label="Réglages" onclick="M.settings()">⚙</button></div></header>`}
function nav(){return `<nav class="nav"><div class="nav-inner">${[['Messages','✉'],['Profil','○']].map(([n,i])=>`<button class="nav-btn ${page===n?'active':''}" onclick="M.go('${n}')"><span>${i}</span>${n}</button>`).join('')}</div></nav>`}
async function listContacts(){if(!me)return[];let ids=me.contacts||[];let arr=await Promise.all(ids.map(async h=>{try{let p=await get('/murmure/v1/profiles/'+key(h));return p?{...p,handle:h}:null}catch{return null}}));return arr.filter(Boolean)}
async function getChatId(a,b){let pair=[a,b].sort().join('|');let digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pair));return [...new Uint8Array(digest)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function lastMessage(h){try{let id=await getChatId(me.handle,h),msgs=await get('/murmure/v1/chats/'+id+'/messages');if(!msgs)return null;return Object.values(msgs).sort((a,b)=>a.time-b.time).at(-1)||null}catch{return null}}
async function messagesPage(){let contacts=await listContacts();let rows=await Promise.all(contacts.map(async p=>({p,m:await lastMessage(p.handle)})));rows.sort((a,b)=>(b.m?.time||0)-(a.m?.time||0));return `<main class="main-grid"><section><div class="row"><div><h1 class="title">Messages</h1><p class="subtitle">Tes conversations, en toute simplicité.</p></div><button class="primary" onclick="M.newChat()">＋ Nouveau</button></div><input id="contactSearch" class="search" placeholder="Rechercher une conversation…" oninput="M.filterChats(this.value)"><div id="inbox" class="inbox">${rows.length?rows.map(({p,m})=>contactRow(p,m)).join(''):'<div class="empty"><div class="emoji">✉️</div><strong>Ta boîte de réception est vide.</strong><p>Commence une conversation avec une personne inscrite sur Murmure.</p><button class="primary" onclick="M.newChat()">Trouver une personne</button></div>'}</div></section><aside class="side-column"><div class="side-card"><span class="privacy-tag">SANS TÉLÉPHONE · SANS E-MAIL</span><h3 style="margin-top:13px">Ton identifiant te suffit.</h3><p>Partage ton pseudo avec tes proches pour qu’ils puissent te retrouver.</p><button class="secondary" onclick="M.copyHandle()">Copier @${esc(me.handle)}</button></div><div class="side-card"><h3>À propos de la sécurité</h3><p>Les messages sont synchronisés via Firebase. Configure des règles Firebase strictes avant de diffuser cette application. Le chiffrement de bout en bout n’est pas activé.</p></div></aside></main>`}
function contactRow(p,m){return `<button class="contact" data-name="${esc((p.name+' '+p.handle).toLowerCase())}" onclick="M.openChat('${esc(p.handle)}')">${avatar(p.emoji)}<div class="contact-info"><div class="contact-line"><span class="contact-name">${esc(p.name||p.handle)}</span><time class="time">${m?ago(m.time):''}</time></div><div class="contact-sub">${m?`${m.from===me.handle?'Toi : ':''}${esc(m.text||'📷 Image')}`:'@'+esc(p.handle)}</div></div></button>`}
function profilePage(){return `<main class="page"><div class="row"><div><h1 class="title">Mon profil</h1><p class="subtitle">Les autres te retrouvent avec ton identifiant.</p></div></div><form id="profileForm" class="profile"><div class="profile-head">${avatar(me.emoji,'lg')}<div><h2>${esc(me.name||me.handle)}</h2><div class="subtitle">@${esc(me.handle)}</div></div></div><label class="label" for="pname">Nom affiché</label><input id="pname" class="field" maxlength="32" value="${esc(me.name||me.handle)}"><label class="label" for="pemoji">Avatar emoji</label><input id="pemoji" class="field" maxlength="8" value="${esc(me.emoji||'🙂')}"><label class="label" for="pbio">Bio (facultative)</label><textarea id="pbio" class="field" maxlength="120" placeholder="Quelques mots sur toi">${esc(me.bio||'')}</textarea><div class="actions"><button class="primary">Enregistrer</button><button type="button" class="secondary" onclick="M.copyHandle()">Copier mon identifiant</button><button type="button" class="secondary" onclick="M.logout()">Se déconnecter</button></div><p class="notice">Ton compte ne demande ni numéro de téléphone ni adresse e-mail. L’identifiant ne peut pas être modifié après sa création.</p></form></main>`}
async function render(){if(!me){onboarding();return}let content=page==='Profil'?profilePage():await messagesPage();if(!me)return;document.getElementById('app').innerHTML=`<div class="shell">${top()}${content}</div>${nav()}`;if(page==='Profil')$('#profileForm').onsubmit=saveProfile;startInboxRefresh()}
async function saveProfile(e){e.preventDefault();let next={...me,name:$('#pname').value.trim().slice(0,32)||me.handle,emoji:$('#pemoji').value.trim().slice(0,8)||'🙂',bio:$('#pbio').value.trim().slice(0,120)};try{await put('/murmure/v1/profiles/'+key(me.handle),next);me=next;localStorage.setItem(SESSION,JSON.stringify(me));render();notify('Profil mis à jour.')}catch(x){notify(errorText(x))}}
function startInboxRefresh(){clearInterval(poll);if(page==='Messages'&&!active)poll=setInterval(async()=>{if(!document.hidden){let e=$('#inbox');if(!e)return;let input=$('#contactSearch'),q=input?.value||'',html=await messagesPage(),temp=document.createElement('div');temp.innerHTML=html;let fresh=temp.querySelector('#inbox');if(fresh){e.innerHTML=fresh.innerHTML;if(q)filterChats(q)}}},7000)}
function filterChats(q){let v=q.trim().toLowerCase();document.querySelectorAll('.contact').forEach(e=>e.hidden=!e.dataset.name.includes(v))}
function overlay(html){$('#overlay').innerHTML=`<div class="modalback" onclick="if(event.target===this)M.closeModal()"><section class="modal">${html}</section></div>`}
function closeModal(){$('#overlay').innerHTML=''}
async function newChat(){overlay(`<h2>Nouvelle conversation</h2><p class="modal-sub">Saisis l’identifiant exact de la personne.</p><form id="findForm"><input id="findHandle" class="field" maxlength="24" placeholder="Identifiant Murmure" autocomplete="off" required><div id="findError" class="error"></div><div class="modal-actions"><button type="button" class="secondary" onclick="M.closeModal()">Annuler</button><button id="findBtn" class="primary">Rechercher</button></div></form><p class="notice">Aucun profil exemple n’est fourni. La personne doit avoir créé son compte sur la même instance.</p>`);$('#findForm').onsubmit=async e=>{e.preventDefault();let h=handle($('#findHandle').value),err=$('#findError'),btn=$('#findBtn');if(h===me.handle){err.textContent='C’est ton propre identifiant.';return}btn.disabled=true;err.textContent='Recherche…';try{let p=await get('/murmure/v1/profiles/'+key(h));if(!p){err.textContent='Compte introuvable. Vérifie l’identifiant.';btn.disabled=false;return}me.contacts=[...new Set([...(me.contacts||[]),h])];await put('/murmure/v1/profiles/'+key(me.handle),me);localStorage.setItem(SESSION,JSON.stringify(me));closeModal();openChat(h)}catch(x){err.textContent=errorText(x);btn.disabled=false}}}
async function openChat(h){clearInterval(poll);active=h;let p;try{p=await get('/murmure/v1/profiles/'+key(h))}catch(x){notify(errorText(x));active=null;render();return}if(!p){active=null;notify('Profil introuvable.');render();return}renderChat(p);poll=setInterval(()=>refreshMessages(p),3500)}
function renderChat(p,msgs=[]){$('#overlay').innerHTML=`<section class="chat"><header class="chat-head"><button class="back" aria-label="Retour" onclick="M.closeChat()">‹</button>${avatar(p.emoji,'sm')}<div class="peer"><strong>${esc(p.name||p.handle)}</strong><small>@${esc(p.handle)}</small></div><button class="iconbtn" onclick="M.chatInfo()" aria-label="Informations">···</button></header><div class="messages" id="messages"><div class="day">Messages synchronisés · ${esc(db.replace(/^https?:\/\//,''))}</div>${msgs.map(m=>bubble(m)).join('')||'<div class="empty" style="margin:auto 0"><div class="emoji">👋</div><strong>Commence la conversation.</strong><p>Écris un message à @'+esc(p.handle)+'.</p></div>'}</div><form id="composer" class="composer"><div class="compose"><button type="button" class="secondary" style="width:42px;height:42px;padding:0;border-radius:50%" onclick="document.getElementById('photo').click()" aria-label="Joindre une image">＋</button><input id="message" type="text" maxlength="2000" autocomplete="off" placeholder="Écris un message…"><input id="photo" type="file" accept="image/*" hidden><button class="send" aria-label="Envoyer">➤</button></div></form></section>`;$('#composer').onsubmit=sendMessage;$('#photo').onchange=e=>sendImage(e.target.files[0]);scrollBottom()}
function bubble(m){return `<div class="bubble ${m.from===me.handle?'out':'in'}">${m.image?`<img src="${esc(m.image)}" alt="Image partagée">`:''}${esc(m.text||'')}<time>${stamp(m.time)} ${m.from===me.handle?'✓':''}</time></div>`}
async function refreshMessages(p){if(!active||document.hidden)return;try{let id=await getChatId(me.handle,active),raw=await get('/murmure/v1/chats/'+id+'/messages'),msgs=Object.values(raw||{}).sort((a,b)=>a.time-b.time),el=$('#messages');if(!el)return;let old=el.scrollHeight-el.scrollTop-el.clientHeight<100;el.innerHTML=`<div class="day">Messages synchronisés</div>${msgs.map(bubble).join('')||'<div class="empty" style="margin:auto 0"><strong>Commence la conversation.</strong></div>'}`;if(old)scrollBottom()}catch(x){console.warn('Actualisation des messages impossible',x)}}
function scrollBottom(){let e=$('#messages');if(e)e.scrollTop=e.scrollHeight}
async function sendMessage(e){e.preventDefault();let input=$('#message'),text=input.value.trim();if(!text||!active)return;let btn=$('.send');btn.disabled=true;try{let id=await getChatId(me.handle,active);await post('/murmure/v1/chats/'+id+'/messages',{from:me.handle,text,time:Date.now()});input.value='';await refreshMessages(person(active))}catch(x){notify(errorText(x))}finally{if(btn)btn.disabled=false;input?.focus()}}
async function sendImage(file){if(!file)return;if(file.size>700000){notify('Image trop volumineuse (limite 700 Ko).');return}let reader=new FileReader();reader.onload=async()=>{try{let id=await getChatId(me.handle,active);await post('/murmure/v1/chats/'+id+'/messages',{from:me.handle,text:'',image:reader.result,time:Date.now()});await refreshMessages(person(active))}catch(x){notify(errorText(x))}};reader.readAsDataURL(file)}
function closeChat(){clearInterval(poll);active=null;closeModal();render()}
function go(n){clearInterval(poll);page=n;active=null;closeModal();render()}
function settings(){overlay(`<h2>Réglages de connexion</h2><p class="modal-sub">URL de la Firebase Realtime Database utilisée pour synchroniser les comptes et les messages.</p><form id="settingsForm"><label class="label" for="dburl">URL de la base</label><input class="field" id="dburl" type="url" value="${esc(db)}" required><p class="notice">Les règles de sécurité Firebase doivent autoriser l’accès aux chemins <code>/murmure/v1</code>. Ne laisse pas une base publique en écriture pour une application diffusée.</p><div id="settingsError" class="error"></div><div class="modal-actions"><button type="button" class="secondary" onclick="M.closeModal()">Annuler</button><button class="primary">Enregistrer</button></div></form>`);$('#settingsForm').onsubmit=async e=>{e.preventDefault();let u=$('#dburl').value.trim().replace(/\/+$/,'');if(!/^https:\/\//.test(u)){$('#settingsError').textContent='Utilise une URL HTTPS.';return}db=u;localStorage.setItem(DBKEY,db);closeModal();notify('URL enregistrée.');if(me)render()}}
function chatInfo(){overlay(`<h2>Conversation</h2><p class="modal-sub">Les messages sont stockés sur la base Firebase de cette instance. Le chiffrement de bout en bout n’est pas activé.</p><div class="modal-actions"><button class="secondary" onclick="M.closeModal()">Fermer</button></div>`)}
async function copyHandle(){try{await navigator.clipboard.writeText('@'+me.handle);notify('Identifiant copié.')}catch{notify('@'+me.handle)}}
function logout(){clearInterval(poll);localStorage.removeItem(SESSION);me=null;active=null;page='Messages';render()}
window.M={newChat,openChat,closeChat,closeModal,go,filterChats,settings,copyHandle,logout,chatInfo};window.addEventListener('online',()=>{let s=document.querySelector('.status');if(s)s.textContent='● En ligne'});window.addEventListener('offline',()=>{let s=document.querySelector('.status');if(s)s.textContent='● Hors ligne'});render();
})();
</script></body></html>
