<style>
:root{color-scheme:dark;--bg:#09090d;--surface:#121219;--surface2:#191922;--surface3:#22222d;--line:#ffffff12;--text:#f7f5fa;--muted:#9895a4;--pink:#ff4d91;--violet:#a879ff;--green:#57e0ad;--shadow:0 28px 90px #0009}*{box-sizing:border-box}html,body,#app{min-height:100%;margin:0}body{background:radial-gradient(ellipse at 70% -15%,#7d3b9c1c,transparent 42%),var(--bg);color:var(--text);font-family:'DM Sans',sans-serif}button,input,textarea{font:inherit}button{color:inherit;cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--pink);outline-offset:3px}button:disabled{opacity:.55;cursor:wait}.hidden{display:none!important}.shell{max-width:1220px;margin:auto;min-height:100vh;padding:0 28px 92px}.topbar{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:8;background:#0b0a10df;backdrop-filter:blur(20px)}.brand{font:800 25px Manrope,sans-serif;letter-spacing:-1.3px;display:flex;align-items:center;gap:10px}.brandmark{width:34px;height:34px;border-radius:12px;background:linear-gradient(140deg,var(--pink),#ff8b67 60%,var(--violet));display:grid;place-items:center;box-shadow:0 6px 24px #ff4d9140}.top-actions{display:flex;align-items:center;gap:10px}.iconbtn{width:42px;height:42px;border-radius:15px;border:1px solid var(--line);background:#ffffff08;display:grid;place-items:center;font-size:18px;transition:.2s}.iconbtn:hover,.secondary:hover{background:#ffffff13;transform:translateY(-1px)}.avatar{width:48px;height:48px;border-radius:50%;padding:2px;background:linear-gradient(135deg,var(--pink),var(--violet));flex:none;box-shadow:0 0 0 3px #ffffff07}.avatar span{width:100%;height:100%;border-radius:50%;background:#27242f;display:grid;place-items:center;font-size:21px;overflow:hidden}.avatar.sm{width:42px;height:42px}.avatar.lg{width:74px;height:74px}.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}.status-pill{font-size:10px;color:#c5c0d0;padding:7px 10px;border:1px solid var(--line);border-radius:99px;background:#ffffff05}.status-pill i{display:inline-block;width:6px;height:6px;background:var(--green);border-radius:50%;margin-right:5px}.main-grid{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:44px;padding-top:31px}.title{font:800 29px Manrope;letter-spacing:-1px;margin:0}.subtitle{color:var(--muted);font-size:14px;margin:6px 0 0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:17px}.primary{border:0;background:linear-gradient(105deg,var(--pink),#ff716e 58%,#b65cff);color:#fff;font-weight:800;border-radius:14px;padding:12px 17px;box-shadow:0 9px 28px #ff4d9129;transition:transform .2s,filter .2s}.primary:hover{transform:translateY(-2px);filter:brightness(1.08)}.secondary{border:1px solid var(--line);background:#ffffff09;border-radius:12px;padding:10px 13px;font-size:13px;font-weight:700;transition:.2s}.text-link{border:0;background:none;color:#ffa2c7;font-size:13px;font-weight:700}.search{width:100%;background:#ffffff07;border:1px solid var(--line);border-radius:15px;padding:14px 16px;color:var(--text);margin:7px 0 17px;transition:.2s}.search:focus,.field:focus{border-color:#ff4d917a;box-shadow:0 0 0 4px #ff4d9112;outline:0}.search::placeholder,.field::placeholder{color:#777482}.inbox{display:flex;flex-direction:column}.contact{display:flex;align-items:center;gap:13px;padding:13px 10px;border:1px solid transparent;border-bottom-color:#ffffff0b;background:none;text-align:left;border-radius:15px;width:100%;transition:.18s}.contact:hover{background:#ffffff08;border-color:#ffffff0b}.contact-info{flex:1;min-width:0}.contact-line{display:flex;justify-content:space-between;gap:8px;align-items:center}.contact-name{font-weight:700;font-size:15px}.contact-sub{color:var(--muted);font-size:13px;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.time{color:var(--muted);font-size:11px;white-space:nowrap}.unread{background:var(--pink);color:white;border-radius:9px;min-width:18px;height:18px;padding:0 5px;display:grid;place-items:center;font-size:10px;font-weight:800}.side-card{border:1px solid #ffffff13;background:linear-gradient(145deg,#19151fdd,#111117e8);backdrop-filter:blur(18px);border-radius:22px;padding:20px;margin-bottom:14px;box-shadow:0 14px 40px #0002}.side-card h3{margin:0 0 10px;font:700 15px Manrope}.side-card p{color:var(--muted);font-size:12px;line-height:1.55;margin:6px 0 14px}.privacy-tag{font-size:9px;color:#e3cfff;background:#a879ff1c;border:1px solid #a879ff22;border-radius:99px;padding:7px 10px;display:inline-flex;font-weight:800;letter-spacing:.5px}.side-glow{background:radial-gradient(circle at 90% 0%,#a879ff30,transparent 54%),linear-gradient(145deg,#1b1524,#121118)}.nav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:#111017d9;backdrop-filter:blur(22px);border-top:1px solid var(--line);padding:9px 12px calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:center}.nav-inner{width:min(500px,100%);display:flex;justify-content:space-around}.nav-btn{background:none;border:0;color:#888592;min-width:68px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px}.nav-btn span{font-size:20px;line-height:24px}.nav-btn.active{color:#fff}.nav-btn.active span{color:#ff85b4;filter:drop-shadow(0 0 8px #ff4d9166)}.stories-section{margin:27px 0 32px}.stories-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.stories{display:flex;gap:17px;overflow:auto;padding:3px 2px 8px;scrollbar-width:none}.stories::-webkit-scrollbar{display:none}.story{width:68px;flex:none;text-align:center;border:0;background:none;padding:0}.story-ring{width:62px;height:62px;border-radius:50%;padding:3px;margin:0 auto 7px;background:linear-gradient(135deg,var(--pink),#ffb15e,var(--violet));position:relative;transition:transform .2s}.story:hover .story-ring{transform:scale(1.06)}.story-ring.seen{background:#55515c}.story-ring {margin-bottom:26px}.onboarding-card h1{font:800 31px/1.12 Manrope;letter-spacing:-1.2px;margin:0 0 10px}.onboarding-card>p{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 21px}.onboarding-card .primary{width:100%;margin-top:16px}.onboarding-card .label{margin-top:14px}.hint{background:#ffffff07;border:1px solid #ffffff0d;padding:12px;border-radius:14px;color:#b9b5c1;font-size:11px;line-height:1.55;margin-top:15px}.error{color:#ff9eaa;font-size:12px;margin:8px 0;line-height:1.45;min-height:16px}.modalback{position:fixed;inset:0;background:#000b;z-index:30;display:grid;place-items:center;padding:18px;backdrop-filter:blur(9px);animation:fade .18s}.modal{width:min(450px,100%);background:linear-gradient(145deg,#1b1822,#121117);border:1px solid #ffffff1b;border-radius:24px;padding:23px;box-shadow:var(--shadow);max-height:90vh;overflow:auto;animation:rise .2s}.modal h2{font:800 21px Manrope;margin:0 0 5px}.modal-sub{font-size:13px;color:var(--muted);margin:0 0 17px;line-height:1.5}.modal .field{margin-bottom:9px}.modal-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:10px}.chat{position:fixed;inset:0;z-index:25;background:radial-gradient(ellipse at 100% 0%,#8c39951c,transparent 45%),var(--bg);display:flex;flex-direction:column;animation:fade .16s}.chat-head{height:70px;padding:0 max(16px,calc((100vw - 760px)/2));border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px;background:#111017db;backdrop-filter:blur(18px)}.back{border:0;background:none;font-size:27px;padding:5px}.peer{flex:1;min-width:0}.peer strong{display:block;font-size:14px}.peer small{color:var(--green);font-size:11px}.messages{flex:1;overflow:auto;width:min(760px,100%);margin:0 auto;padding:20px 17px;display:flex;flex-direction:column;gap:9px;scroll-behavior:smooth}.day{text-align:center;color:var(--muted);font-size:10px;margin:4px 0 9px}.bubble{max-width:min(78%,460px);padding:11px 14px;border-radius:19px;font-size:14px;line-height:1.45;overflow-wrap:anywhere;white-space:pre-wrap;animation:bubbleIn .2s}.bubble.in{align-self:flex-start;background:#25232d;border:1px solid #ffffff08;border-bottom-left-radius:6px}.bubble.out{align-self:flex-end;background:linear-gradient(125deg,#d83f79,#a551bd);border-bottom-right-radius:6px;box-shadow:0 7px 18px #a551bd22}.bubble time{display:block;font-size:9px;opacity:.68;text-align:right;margin-top:4px}.bubble img{max-width:100%;border-radius:12px;display:block;margin-bottom:6px}.composer{padding:10px max(15px,calc((100vw - 760px)/2)) calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#111017dc;backdrop-filter:blur(18px)}.compose{display:flex;align-items:center;gap:8px}.compose input[type=text]{flex:1;min-width:0;background:#ffffff0a;border:1px solid #ffffff12;border-radius:24px;padding:13px 16px;color:white}.send{width:44px;height:44px;border:0;border-radius:50%;background:linear-gradient(135deg,var(--pink),#b85dff);font-size:18px;box-shadow:0 5px 16px #ff4d9133}.toast{position:fixed;z-index:60;bottom:90px;left:50%;transform:translateX(-50%);background:#24212b;border:1px solid #ffffff20;padding:11px 16px;border-radius:14px;font-size:13px;box-shadow:var(--shadow);max-width:90vw}.toast[hidden]{display:none}.story-view{position:fixed;inset:0;z-index:40;background:#09080ddd;backdrop-filter:blur(10px);display:grid;place-items:center;padding:16px;animation:fade .2s}.story-card{width:min(410px,100%);height:min(740px,90vh);border:1px solid #ffffff20;border-radius:28px;padding:19px;display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(ellipse at 75% 15%,#d953aa55,transparent 45%),linear-gradient(150deg,#422b4d,#211c2b 62%,#15131c);box-shadow:var(--shadow)}.story-card p{font:800 29px/1.24 Manrope;white-space:pre-wrap;overflow-wrap:anywhere}.story-close{border:1px solid #ffffff20;background:#0005;border-radius:50%;height:38px;width:38px;font-size:20px}.story-progress{height:3px;background:#ffffff45;border-radius:5px;margin-bottom:14px;overflow:hidden}.story-progress:before{content:'';display:block;width:40%;height:100%;background:white;border-radius:5px}.story-author{display:flex;align-items:center;gap:10px}.story-author small{display:block;color:#ffffffa8;font-size:11px;margin-top:2px}.story-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.story-tile{min-height:210px;border-radius:20px;padding:15px;display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(circle at 85% 4%,#e76ca844,transparent 45%),linear-gradient(160deg,#35263c,#191721);border:1px solid #ffffff13;text-align:left}.story-tile p{font:700 17px Manrope;line-height:1.3;overflow-wrap:anywhere}.small-muted{color:var(--muted);font-size:11px}.profile-results{max-height:55vh;overflow:auto}.result{display:flex;align-items:center;gap:12px;padding:11px 6px;border-bottom:1px solid var(--line)}.result-info{flex:1}.result-info strong{display:block;font-size:14px}.result-info small{color:var(--muted)}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes bubbleIn{from{opacity:.3;transform:translateY(4px)}to{opacity:1;transform:none}}
@media(max-width:850px){.main-grid{grid-template-columns:1fr;gap:16px}.side-column{display:grid;grid-template-columns:1fr 1fr;gap:12px}.side-card{margin:0}.shell{max-width:700px}.story-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:560px){.shell{padding:0 15px 86px}.topbar{height:65px}.main-grid{padding-top:22px}.side-column{display:none}.title{font-size:24px}.profile{padding:18px}.page{padding-top:22px}.onboarding-card{padding:25px 22px}.onboarding-card h1{font-size:28px}.story-grid{grid-template-columns:repeat(2,1fr)}.story-tile{min-height:185px}.status-pill{font-size:0}.status-pill i{margin:0}}

<body><div id="app"></div><div id="overlay"></div><div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script>
(()=>{'use strict';
const DBKEY='murmure.dburl',SESSION='murmure.session.v2';let db=(localStorage.getItem(DBKEY)||'https://messagame-e5a03-default-rtdb.europe-west1.firebasedatabase.app').replace(/\/+$/,''),me=null,page='Messages',active=null,refreshTimer=null,notifTimer=null,lastSeen={},toastTimer=0,searchTimer=0;
try{me=JSON.parse(localStorage.getItem(SESSION)||'null')}catch{}
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),handle=s=>String(s||'').trim().replace(/^@/,'').toLowerCase().replace(/[^a-z0-9._-]/g,'').slice(0,24),key=s=>encodeURIComponent(s).replace(/\./g,'%2E'),avatar=(emoji='🙂',size='')=>`<div class="avatar ${size}"><span>${esc(emoji||'🙂')}</span></div>`,stamp=t=>new Date(t||Date.now()).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}),ago=t=>{let n=Date.now()-t;return n<60000?'maintenant':n<3600000?Math.floor(n/60000)+' min':n<86400000?Math.floor(n/3600000)+' h':new Date(t).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})};
function notify(s){let e=$('#toast');if(!e)return;e.textContent=s;e.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.hidden=true,3200)}
async function request(path,opts={}){if(!db)throw Error('Configure Firebase dans les réglages.');let r=await fetch(db.replace(/\/+$/,'')+path+'.json',{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});let d=await r.json().catch(()=>null);if(!r.ok||d&&d.error)throw Error((d&&d.error)||('Erreur réseau '+r.status));return d}
const get=p=>request(p),put=(p,d)=>request(p,{method:'PUT',body:JSON.stringify(d)}),post=(p,d)=>request(p,{method:'POST',body:JSON.stringify(d)});
async function derive(pass,salt){let k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveBits']);let b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:210000,hash:'SHA-256'},k,256);return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function reserveHandle(h,record){let path='/murmure/v1/credentials/'+key(h),r=await fetch(db+path+'.json',{headers:{'X-Firebase-ETag':'true'}}),old=await r.json().catch(()=>null),tag=r.headers.get('ETag');if(!r.ok)throw Error('Impossible de vérifier cet identifiant.');if(old!==null)throw Error('Cet identifiant est déjà pris.');let w=await fetch(db+path+'.json',{method:'PUT',headers:{'Content-Type':'application/json','If-Match':tag||'"null"'},body:JSON.stringify(record)});if(w.status===412)throw Error('Cet identifiant vient d’être choisi. Essaie-en un autre.');if(!w.ok)throw Error('Création du compte refusée par Firebase. Vérifie les règles de la base.');}
function logo(){return '<div class="brand"><span class="brandmark">✳</span>Murmure</div>'}
function errorText(e){let s=String(e&&e.message||e);if(s.includes('Failed to fetch'))return'Connexion impossible. Vérifie Internet et l’URL Firebase.';if(s.includes('PERMISSION_DENIED'))return'Accès Firebase refusé. Les règles de la base doivent autoriser les opérations Murmure.';return s}
function onboarding(){document.getElementById('app').innerHTML=`<div class="onboarding"><section class="onboarding-card">${logo()}<h1>Ta messagerie.<br>À ta façon.</h1><p>Un identifiant unique suffit. Pas de numéro, pas d’adresse e-mail.</p><form id="auth"><label class="label" for="user">Identifiant unique</label><input id="user" class="field" maxlength="24" autocomplete="username" placeholder="ex. alex.rose" required><label class="label" for="displayName">Nom affiché</label><input id="displayName" class="field" maxlength="32" autocomplete="nickname" placeholder="Comment on t’appelle ?" required><label class="label" for="pass">Mot de passe</label><input id="pass" class="field" type="password" minlength="10" autocomplete="new-password" placeholder="10 caractères minimum" required><div class="hint">Choisis un mot de passe unique. Sans e-mail ni téléphone, sa récupération sera impossible si tu l’oublies. Cette version ne propose pas encore le chiffrement de bout en bout.</div><div id="authError" class="error"></div><button id="authBtn" class="primary">Créer mon compte →</button><button type="button" class="text-link" style="width:100%;padding:13px" onclick="M.showLogin()">J’ai déjà un compte</button></form></section></div>`;$('#auth').onsubmit=createAccount}
function showLogin(){let card=document.querySelector('.onboarding-card');if(!card)return;card.innerHTML=`${logo()}<h1>Heureux de te revoir.</h1><p>Connecte-toi avec ton identifiant Murmure.</p><form id="auth"><label class="label" for="user">Identifiant</label><input id="user" class="field" maxlength="24" autocomplete="username" placeholder="Ton identifiant" required><label class="label" for="pass">Mot de passe</label><input id="pass" class="field" type="password" autocomplete="current-password" placeholder="Ton mot de passe" required><div id="authError" class="error"></div><button id="authBtn" class="primary">Se connecter</button><button type="button" class="text-link" style="width:100%;padding:13px" onclick="M.onboarding()">Créer un compte</button></form>`;$('#auth').onsubmit=login}
async function createAccount(e){e.preventDefault();let h=handle($('#user').value),name=$('#displayName').value.trim(),pw=$('#pass').value,err=$('#authError'),btn=$('#authBtn');if(h.length<3){err.textContent='Identifiant : 3 caractères minimum (lettres, chiffres, point, tiret, souligné).';return}if(!/^[a-z0-9][a-z0-9._-]{2,23}$/.test(h)){err.textContent='Cet identifiant contient des caractères non autorisés.';return}if(pw.length<10){err.textContent='Le mot de passe doit contenir au moins 10 caractères.';return}if(!crypto.subtle){err.textContent='Navigateur incompatible avec la sécurité requise.';return}btn.disabled=true;err.textContent='Création du compte…';try{let salt=[...crypto.getRandomValues(new Uint8Array(16))].map(x=>x.toString(16).padStart(2,'0')).join(''),hash=await derive(pw,salt),profile={handle:h,name:name.slice(0,32),emoji:'🙂',bio:'',created:Date.now()};await reserveHandle(h,{salt,hash,created:Date.now()});try{await put('/murmure/v1/profiles/'+key(h),profile)}catch(x){await request('/murmure/v1/credentials/'+key(h),{method:'DELETE'});throw x}me=profile;localStorage.setItem(SESSION,JSON.stringify(me));render()}catch(x){err.textContent=errorText(x);btn.disabled=false}}
async function login(e){e.preventDefault();let h=handle($('#user').value),pw=$('#pass').value,err=$('#authError'),btn=$('#authBtn');btn.disabled=true;err.textContent='Connexion…';try{let c=await get('/murmure/v1/credentials/'+key(h));if(!c)throw Error('Identifiant ou mot de passe incorrect.');if(await derive(pw,c.salt)!==c.hash)throw Error('Identifiant ou mot de passe incorrect.');let p=await get('/murmure/v1/profiles/'+key(h));if(!p)throw Error('Profil introuvable.');me=p;localStorage.setItem(SESSION,JSON.stringify(me));render()}catch(x){err.textContent=errorText(x);btn.disabled=false}}
function top(){return `<header class="topbar">${logo()}<div class="top-actions"><span class="status-pill"><i></i>${navigator.onLine?'En ligne':'Hors ligne'}</span><button class="iconbtn" aria-label="Nouvelle conversation" onclick="M.newChat()">✎</button><button class="iconbtn" aria-label="Réglages" onclick="M.settings()">⚙</button></div></header>`}
function nav(){return `<nav class="nav"><div class="nav-inner">${[['Messages','✉'],['Stories','◉'],['Découvrir','⌕'],['Profil','○']].map(([n,i])=>`<button class="nav-btn ${page===n?'active':''}" onclick="M.go('${n}')"><span>${i}</span>${n}</button>`).join('')}</div></nav>`}
async function contacts(){let ids=[...new Set(me.contacts||[])];return(await Promise.all(ids.map(async h=>{try{let p=await get('/murmure/v1/profiles/'+key(h));return p?{...p,handle:h}:null}catch{return null}}))).filter(Boolean)}
async function chatId(a,b){let d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode([a,b].sort().join('|')));return[...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function readMessages(other){let id=await chatId(me.handle,other),data=await get('/murmure/v1/chats/'+id+'/messages');return Object.entries(data||{}).map(([id,m])=>({...m,id})).sort((a,b)=>a.time-b.time)}
async function lastMsg(h){try{return(await readMessages(h)).at(-1)||null}catch{return null}}
function storyStrip(list){let ids=[...new Set(list.map(s=>s.user))];return `<section class="stories-section"><div class="stories-head"><div><strong>Stories</strong><div class="small-muted">Les instants de ton cercle · 24 h</div></div><button class="text-link" onclick="M.addStory()">＋ Ta story</button></div><div class="stories"><button class="story" onclick="M.addStory()"><div class="story-ring add-ring"><span>${esc(me.emoji||'🙂')}</span></div><span class="story-label">Ta story</span></button>${ids.filter(id=>id!==me.handle).map(id=>{let s=list.filter(x=>x.user===id).sort((a,b)=>b.created-a.created)[0];return `<button class="story" onclick="M.viewStory('${esc(s.id)}')"><div class="story-ring"><span>${esc(s.emoji||'🙂')}</span></div><span class="story-label">${esc(s.name||id)}</span></button>`}).join('')}</div></section>`}
async function messagesPage(){let [list,ss]=await Promise.all([contacts(),loadStories()]);let rows=await Promise.all(list.map(async p=>({p,m:await lastMsg(p.handle)})));rows.sort((a,b)=>(b.m?.time||0)-(a.m?.time||0));return `<main class="main-grid"><section><div class="row"><div><h1 class="title">Messages</h1><p class="subtitle">Tes conversations, tes proches.</p></div><button class="primary" onclick="M.newChat()">＋ Nouveau</button></div>${storyStrip(ss)}<input id="contactSearch" class="search" placeholder="⌕  Rechercher dans tes conversations…" oninput="M.filterChats(this.value)"><div id="inbox" class="inbox">${rows.length?rows.map(({p,m})=>contactRow(p,m)).join(''):'<div class="empty"><div class="emoji">✉️</div><strong>Ta boîte de réception est vide.</strong><p>Recherche une personne par identifiant pour lancer une conversation.</p><button class="primary" onclick="M.newChat()">Trouver une personne</button></div>'}</div></section><aside class="side-column"><div class="side-card side-glow"><span class="privacy-tag">SANS TÉLÉPHONE · SANS E-MAIL</span><h3 style="margin-top:14px">Ton identifiant te suffit.</h3><p>Partage ton pseudo avec tes proches pour qu’ils puissent te retrouver.</p><button class="secondary" onclick="M.copyHandle()">Copier @${esc(me.handle)}</button></div><div class="side-card"><h3>Notifications</h3><p>Autorise les notifications dans ce navigateur pour recevoir une alerte quand un message arrive pendant que Murmure est ouvert.</p><button class="secondary" onclick="M.enableNotifications()">Activer les notifications</button></div></aside></main>`}
function contactRow(p,m){let unread=m&&m.from!==me.handle&&(!lastSeen[p.handle]||m.time>lastSeen[p.handle]);return `<button class="contact" data-name="${esc((p.name+' '+p.handle).toLowerCase())}" onclick="M.openChat('${esc(p.handle)}')">${avatar(p.emoji)}<div class="contact-info"><div class="contact-line"><span class="contact-name">${esc(p.name||p.handle)}</span><time class="time">${m?ago(m.time):''}</time></div><div class="contact-line"><span class="contact-sub">${m?`${m.from===me.handle?'Toi : ':''}${esc(m.text||'📷 Image')}`:'@'+esc(p.handle)}</span>${unread?'<span class="unread">●</span>':''}</div></div></button>`}
async function profilePage(){return `<main class="page"><div class="row"><div><h1 class="title">Mon profil</h1><p class="subtitle">Ton identifiant unique sur Murmure.</p></div></div><form id="profileForm" class="profile"><div class="profile-head">${avatar(me.emoji,'lg')}<div><h2>${esc(me.name)}</h2><div class="subtitle">@${esc(me.handle)}</div></div></div><label class="label" for="pname">Nom affiché</label><input id="pname" class="field" maxlength="32" value="${esc(me.name)}"><label class="label" for="pemoji">Avatar emoji</label><input id="pemoji" class="field" maxlength="8" value="${esc(me.emoji||'🙂')}"><label class="label" for="pbio">Bio (facultative)</label><textarea id="pbio" class="field" maxlength="120" placeholder="Quelques mots sur toi">${esc(me.bio||'')}</textarea><div class="actions"><button class="primary">Enregistrer</button><button type="button" class="secondary" onclick="M.copyHandle()">Copier mon identifiant</button><button type="button" class="secondary" onclick="M.logout()">Se déconnecter</button></div><p class="notice">Sans numéro ni e-mail, ton mot de passe est le seul moyen de retrouver ton compte. Il ne peut pas être récupéré si tu l’oublies.</p></form></main>`}
async function storiesPage(){let ss=await loadStories();return `<main class="page"><div class="row"><div><h1 class="title">Stories</h1><p class="subtitle">Elles disparaissent automatiquement après 24 heures.</p></div><button class="primary" onclick="M.addStory()">＋ Partager</button></div>${ss.length?`<div class="story-grid">${ss.map(s=>`<button class="story-tile" onclick="M.viewStory('${esc(s.id)}')"><div class="story-author">${avatar(s.emoji,'sm')}<div><strong>${esc(s.name||s.user)}</strong><small>@${esc(s.user)} · ${ago(s.created)}</small></div></div><p>${esc(s.text)}</p><span class="small-muted">Voir la story →</span></button>`).join('')}</div>`:'<div class="empty"><div class="emoji">◉</div><strong>Aucune story pour le moment.</strong><p>Partage un instant avec tes contacts.</p><button class="primary" onclick="M.addStory()">Créer une story</button></div>'}</main>`}
async function discoverPage(){return `<main class="page"><div class="row"><div><h1 class="title">Découvrir</h1><p class="subtitle">Retrouve une personne avec son identifiant.</p></div></div><form id="searchPeopleForm"><input id="peopleSearch" class="search" placeholder="⌕  Chercher un identifiant ou un nom…" autocomplete="off"></form><div id="peopleResults" class="profile-results"><div class="empty">Recherche un identifiant pour trouver un compte.</div></div><p class="notice">Les identifiants sont publics pour permettre la recherche. Ne choisis pas un identifiant contenant des informations personnelles.</p></main>`}
async function render(){if(!me){clearInterval(refreshTimer);clearInterval(notifTimer);onboarding();return}let content;try{content=page==='Profil'?await profilePage():page==='Stories'?await storiesPage():page==='Découvrir'?await discoverPage():await messagesPage()}catch(e){content=`<main class="page"><div class="empty"><div class="emoji">☁️</div><strong>Impossible de charger Murmure.</strong><p>${esc(errorText(e))}</p><button class="primary" onclick="M.render()">Réessayer</button></div></main>`}if(!me)return;document.getElementById('app').innerHTML=`<div class="shell">${top()}${content}</div>${nav()}`;if(page==='Profil')$('#profileForm').onsubmit=saveProfile;if(page==='Découvrir')$('#searchPeopleForm').onsubmit=e=>{e.preventDefault();searchUsers($('#peopleSearch').value)};startRefresh()}
async function saveProfile(e){e.preventDefault();let next={...me,name:$('#pname').value.trim().slice(0,32)||me.handle,emoji:$('#pemoji').value.trim().slice(0,8)||'🙂',bio:$('#pbio').value.trim().slice(0,120)};try{await put('/murmure/v1/profiles/'+key(me.handle),next);me=next;localStorage.setItem(SESSION,JSON.stringify(me));render();notify('Profil mis à jour.')}catch(x){notify(errorText(x))}}
async function loadStories(){try{let raw=await get('/murmure/v1/stories'),now=Date.now(),items=Object.entries(raw||{}).map(([id,s])=>({...s,id})).filter(s=>s.created&&now-s.created<86400000).sort((a,b)=>b.created-a.created);return items}catch{return[]}}
function startRefresh(){clearInterval(refreshTimer);clearInterval(notifTimer);if(!me)return;if(page==='Messages'&&!active){refreshTimer=setInterval(async()=>{if(!document.hidden){let e=$('#inbox');if(!e)return;let q=$('#contactSearch')?.value||'',tmp=document.createElement('div');tmp.innerHTML=await messagesPage();let fresh=tmp.querySelector('#inbox');if(fresh){e.innerHTML=fresh.innerHTML;if(q)filterChats(q)}}},8000);notifTimer=setInterval(checkNotifications,9000)}}
function filterChats(q){let v=q.trim().toLowerCase();document.querySelectorAll('.contact').forEach(e=>e.hidden=!e.dataset.name.includes(v))}
async function searchUsers(q){let box=$('#peopleResults'),term=handle(q);if(!box)return;if(!term){box.innerHTML='<div class="empty">Saisis un identifiant ou un nom à rechercher.</div>';return}box.innerHTML='<div class="empty">Recherche…</div>';try{let data=await get('/murmure/v1/profiles'),list=Object.values(data||{}).filter(p=>p&&p.handle!==me.handle&&((p.handle||'').includes(term)||(p.name||'').toLowerCase().includes(q.trim().toLowerCase()))).slice(0,30);box.innerHTML=list.length?list.map(p=>`<div class="result">${avatar(p.emoji,'sm')}<div class="result-info"><strong>${esc(p.name||p.handle)}</strong><small>@${esc(p.handle)}</small></div><button class="secondary" onclick="M.addContact('${esc(p.handle)}')">Message</button></div>`).join(''):'<div class="empty">Aucun compte ne correspond à cette recherche.</div>'}catch(e){box.innerHTML=`<div class="empty">${esc(errorText(e))}</div>`}}
function overlay(html){$('#overlay').innerHTML=`<div class="modalback" onclick="if(event.target===this)M.closeModal()"><section class="modal">${html}</section></div>`}function closeModal(){$('#overlay').innerHTML=''}
async function newChat(){overlay(`<h2>Nouvelle conversation</h2><p class="modal-sub">Recherche un compte avec son identifiant unique.</p><form id="findForm"><input id="findHandle" class="field" maxlength="24" placeholder="Identifiant ou nom" autocomplete="off" required><div id="findResults" class="profile-results"></div><div id="findError" class="error"></div><div class="modal-actions"><button type="button" class="secondary" onclick="M.closeModal()">Fermer</button><button class="primary">Rechercher</button></div></form>`);$('#findForm').onsubmit=async e=>{e.preventDefault();let q=$('#findHandle').value.trim();await searchModal(q)}}
async function searchModal(q){let box=$('#findResults'),term=handle(q);box.innerHTML='<div class="small-muted">Recherche…</div>';try{let data=await get('/murmure/v1/profiles'),list=Object.values(data||{}).filter(p=>p&&p.handle!==me.handle&&((p.handle||'').includes(term)||(p.name||'').toLowerCase().includes(q.toLowerCase()))).slice(0,20);box.innerHTML=list.length?list.map(p=>`<div class="result">${avatar(p.emoji,'sm')}<div class="result-info"><strong>${esc(p.name||p.handle)}</strong><small>@${esc(p.handle)}</small></div><button type="button" class="secondary" onclick="M.addContact('${esc(p.handle)}')">Message</button></div>`).join(''):'<div class="small-muted">Aucun compte trouvé.</div>'}catch(x){box.innerHTML=`<div class="error">${esc(errorText(x))}</div>`}}
async function addContact(h){try{let p=await get('/murmure/v1/profiles/'+key(h));if(!p)throw Error('Ce compte est introuvable.');me.contacts=[...new Set([...(me.contacts||[]),h])];await put('/murmure/v1/profiles/'+key(me.handle),me);localStorage.setItem(SESSION,JSON.stringify(me));closeModal();openChat(h)}catch(e){notify(errorText(e))}}
async function openChat(h){clearInterval(refreshTimer);active=h;try{let p=await get('/murmure/v1/profiles/'+key(h));if(!p)throw Error('Profil introuvable.');let msgs=await readMessages(h);lastSeen[h]=Date.now();renderChat(p,msgs);refreshTimer=setInterval(()=>refreshMessages(h,p),3500)}catch(e){active=null;notify(errorText(e));render()}}
function renderChat(p,msgs=[]){$('#overlay').innerHTML=`<section class="chat"><header class="chat-head"><button class="back" aria-label="Retour" onclick="M.closeChat()">‹</button>${avatar(p.emoji,'sm')}<div class="peer"><strong>${esc(p.name||p.handle)}</strong><small>@${esc(p.handle)}</small></div><button class="iconbtn" onclick="M.chatInfo()" aria-label="Infos">···</button></header><div class="messages" id="messages"><div class="day">Conversation privée avec @${esc(p.handle)}</div>${msgs.map(bubble).join('')||'<div class="empty" style="margin:auto 0"><div class="emoji">👋</div><strong>Commence la conversation.</strong><p>Écris un premier message à '+esc(p.name||p.handle)+'.</p></div>'}</div><form id="composer" class="composer"><div class="compose"><button type="button" class="secondary" style="width:43px;height:43px;padding:0;border-radius:50%" onclick="document.getElementById(\'photo\').click()" aria-label="Joindre une image">＋</button><input id="message" type="text" maxlength="2000" autocomplete="off" placeholder="Écris un message…"><input id="photo" type="file" accept="image/*" hidden><button class="send" aria-label="Envoyer">➤</button></div></form></section>`;$('#composer').onsubmit=sendMessage;$('#photo').onchange=e=>sendImage(e.target.files[0]);scrollBottom()}
function bubble(m){return `<div class="bubble ${m.from===me.handle?'out':'in'}">${m.image?`<img src="${esc(m.image)}" alt="Image partagée">`:''}${esc(m.text||'')}<time>${stamp(m.time)} ${m.from===me.handle?'✓':''}</time></div>`}
async function refreshMessages(h,p){if(!active||active!==h||document.hidden)return;try{let msgs=await readMessages(h),el=$('#messages');if(!el)return;let near=el.scrollHeight-el.scrollTop-el.clientHeight<110;el.innerHTML=`<div class="day">Conversation privée avec @${esc(h)}</div>${msgs.map(bubble).join('')||'<div class="empty" style="margin:auto 0"><strong>Commence la conversation.</strong></div>'}`;if(near)scrollBottom();if(msgs.at(-1)?.from!==me.handle)lastSeen[h]=Date.now()}catch(e){console.warn(errorText(e))}}
function scrollBottom(){let e=$('#messages');if(e)e.scrollTop=e.scrollHeight}
async function sendMessage(e){e.preventDefault();let input=$('#message'),text=input.value.trim(),btn=$('.send');if(!text||!active)return;btn.disabled=true;try{let id=await chatId(me.handle,active);await post('/murmure/v1/chats/'+id+'/messages',{from:me.handle,text,time:Date.now()});input.value='';await refreshMessages(active)}catch(x){notify(errorText(x))}finally{if(btn)btn.disabled=false;input?.focus()}}
async function sendImage(file){if(!file)return;if(file.size>650000){notify('Image trop volumineuse (limite 650 Ko).');return}let reader=new FileReader();reader.onload=async()=>{try{let id=await chatId(me.handle,active);await post('/murmure/v1/chats/'+id+'/messages',{from:me.handle,text:'',image:reader.result,time:Date.now()});await refreshMessages(active)}catch(x){notify(errorText(x))}};reader.readAsDataURL(file)}
function closeChat(){clearInterval(refreshTimer);active=null;closeModal();render()}
async function addStory(){overlay(`<h2>Partager une story</h2><p class="modal-sub">Ta story disparaîtra automatiquement après 24 heures.</p><form id="storyForm"><textarea class="field" id="storyText" maxlength="220" rows="4" placeholder="Un moment à partager…" required></textarea><div id="storyError" class="error"></div><div class="modal-actions"><button type="button" class="secondary" onclick="M.closeModal()">Annuler</button><button class="primary">Publier ma story</button></div></form>`);$('#storyForm').onsubmit=async e=>{e.preventDefault();let text=$('#storyText').value.trim();if(!text)return;try{await post('/murmure/v1/stories',{user:me.handle,name:me.name,emoji:me.emoji,text,created:Date.now(),expires:Date.now()+86400000});closeModal();page='Stories';render();notify('Story publiée pour 24 heures.')}catch(x){$('#storyError').textContent=errorText(x)}}}
async function viewStory(id){try{let s=(await loadStories()).find(x=>x.id===id);if(!s)return;$('#overlay').innerHTML=`<div class="story-view" onclick="M.closeModal()"><article class="story-card" onclick="event.stopPropagation()"><div><div class="story-progress"></div><div class="story-author">${avatar(s.emoji,'sm')}<div><strong>${esc(s.name||s.user)}</strong><small>@${esc(s.user)} · ${ago(s.created)}</small></div><button class="story-close" style="margin-left:auto" onclick="M.closeModal()">×</button></div></div><p>${esc(s.text)}</p><small class="small-muted">Cette story disparaît après 24 heures.</small></article></div>`}catch(e){notify(errorText(e))}}
async function checkNotifications(){if(!me||document.hidden)return;try{let list=await contacts();for(let p of list){let m=await lastMsg(p.handle);if(!m||m.from===me.handle)continue;let keyid=p.handle+':'+m.time;if(lastSeen[p.handle]&&m.time<=lastSeen[p.handle])continue;if(localStorage.getItem('murmure.notified.'+keyid))continue;localStorage.setItem('murmure.notified.'+keyid,'1');notify('Nouveau message de '+(p.name||p.handle));if('Notification'in window&&Notification.permission==='granted')new Notification('Murmure · '+(p.name||p.handle),{body:m.text||'Image reçue',tag:'murmure-'+p.handle})}}catch(e){console.warn('Notifications:',errorText(e))}}
async function enableNotifications(){if(!('Notification'in window)){notify('Les notifications ne sont pas prises en charge par ce navigateur.');return}try{let p=await Notification.requestPermission();notify(p==='granted'?'Notifications activées pendant que Murmure est ouvert.':p==='denied'?'Autorisation refusée dans les réglages du navigateur.':'Autorisation non accordée.')}catch(e){notify('Impossible d’activer les notifications.') }}
function settings(){overlay(`<h2>Réglages de connexion</h2><p class="modal-sub">Adresse de ta Firebase Realtime Database.</p><form id="settingsForm"><label class="label" for="dburl">URL de la base</label><input class="field" id="dburl" type="url" value="${esc(db)}" required><p class="notice">Firebase doit autoriser les requêtes à <code>/murmure/v1</code>. Configure des règles d’accès adaptées avant toute diffusion publique. Les messages ne sont pas chiffrés de bout en bout. Notifications fermées : un service push côté serveur est nécessaire.</p><div id="settingsError" class="error"></div><div class="modal-actions"><button type="button" class="secondary" onclick="M.closeModal()">Annuler</button><button class="primary">Enregistrer</button></div></form>`);$('#settingsForm').onsubmit=e=>{e.preventDefault();let u=$('#dburl').value.trim().replace(/\/+$/,'');if(!/^https:\/\//.test(u)){$('#settingsError').textContent='Utilise une adresse HTTPS.';return}db=u;localStorage.setItem(DBKEY,db);closeModal();notify('Adresse Firebase mise à jour.');render()}}
function chatInfo(){overlay(`<h2>À propos de cette conversation</h2><p class="modal-sub">Les messages sont synchronisés avec Firebase. Ils ne sont pas chiffrés de bout en bout dans cette version.</p><div class="modal-actions"><button class="secondary" onclick="M.closeModal()">Fermer</button></div>`)}
async function copyHandle(){try{await navigator.clipboard.writeText('@'+me.handle);notify('Identifiant copié.')}catch{notify('@'+me.handle)}}function logout(){clearInterval(refreshTimer);clearInterval(notifTimer);localStorage.removeItem(SESSION);me=null;active=null;page='Messages';render()}
function go(n){clearInterval(refreshTimer);page=n;active=null;closeModal();render()}
window.M={render,onboarding,showLogin,go,newChat,closeModal,openChat,closeChat,filterChats,addStory,viewStory,settings,copyHandle,logout,chatInfo,enableNotifications,addContact,searchUsers};window.addEventListener('online',()=>{let e=document.querySelector('.status-pill');if(e)e.innerHTML='<i></i>En ligne'});window.addEventListener('offline',()=>{let e=document.querySelector('.status-pill');if(e)e.innerHTML='<i style="background:#ffbc5e"></i>Hors ligne'});document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkNotifications()});render();
})();
</script></body></html>
